# Nightly check of main: tests, type check and the release guard. It skips the work when
# nothing landed in the last 24 hours, and can be started by hand from the Actions tab.
# (Releases have their own workflow, release.yml.)
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC, off the full hour when GitHub's scheduler is busiest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Skip a quiet day
        id: changes
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -n "$(git log --since='25 hours ago' --format=%H -1)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits in the last day, nothing to check"
          fi

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.changes.outputs.run == 'true'
        run: npm ci

      - name: Test
        if: steps.changes.outputs.run == 'true'
        run: npm test

      - name: Type check
        if: steps.changes.outputs.run == 'true'
        run: npm run check

      - name: Release guard
        if: steps.changes.outputs.run == 'true'
        run: npm run check:release
